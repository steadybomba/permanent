<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password | Results Vault</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #10191c;
            --panel: #182629;
            --line: #34474a;
            --text: #edf2ed;
            --muted: #9cadaa;
            --accent: #c3e66b;
            --danger: #ff9a8b;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: repeating-linear-gradient(135deg, #121d20 0 1px, var(--page) 1px 14px);
            color: var(--text);
            font: 15px/1.5 "Segoe UI", sans-serif;
        }
        main { width: min(100%, 440px); }
        .brand {
            margin: 0 0 22px 2px;
            color: var(--accent);
            font: 700 12px/1.4 Consolas, monospace;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        section {
            padding: 30px;
            border: 1px solid var(--line);
            background: var(--panel);
        }
        h1 { margin: 0 0 5px; font-size: 24px; }
        .identity { margin: 0 0 24px; color: var(--muted); }
        label { display: block; margin: 17px 0 6px; font-size: 13px; font-weight: 600; }
        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: #10191c;
            color: var(--text);
            font: inherit;
        }
        input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .notice { margin: 0 0 16px; color: var(--accent); }
        .error { margin: 0 0 16px; color: var(--danger); }
        .actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; }
        button, .back {
            min-height: 42px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: transparent;
            color: var(--text);
            font: 600 12px Consolas, monospace;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
        }
        button { border-color: var(--accent); background: var(--accent); color: #172019; }
        button:hover { filter: brightness(1.08); }
        .back:hover { border-color: var(--muted); }
        @media (max-width: 480px) {
            body { padding: 16px; }
            section { padding: 22px; }
            .actions { align-items: stretch; flex-direction: column; }
            .actions a, .actions button { text-align: center; }
        }
    </style>
</head>
<body>
<main>
    <p class="brand">Results Vault / Operator account</p>
    <section>
        <h1>Change password</h1>
        <p class="identity">Signed in as {{ username }}</p>
        {% if updated %}<p class="notice" role="status">Password updated successfully.</p>{% endif %}
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="current_password">Current password</label>
            <input id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
            <label for="new_password">New password</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
            <label for="confirm_password">Confirm new password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
            <div class="actions">
                <button type="submit">Update password</button>
                <a class="back" href="{{ url_for('results_vault_page') }}">Back to dashboard</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
