version: '3.8'
services:
  evul:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: evul:latest
    container_name: evul_app_prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - REQUIRE_AUTH=true
      - FLASK_ENV=production
      - PROJECT_DB_PATH=/app/data/project_data.db
      - HARVESTER_STATE_FILE=/app/data/harvester_state.json
      - BUILDER_DATA_PATH=/app/data/builder_data        # ← ADD THIS LINE
      - DRS_OUT_PATH=/app/drs_out
      - LOG_DIR=/app/logs
    volumes:
      - ./data:/app/data
      - ./drs_out:/app/drs_out
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./email_templates:/app/email_templates
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"